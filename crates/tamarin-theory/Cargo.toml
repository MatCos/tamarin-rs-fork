[package]
name = "tamarin-theory"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Theory representation for the Tamarin prover (Rust port)."

[dependencies]
tamarin-utils = { workspace = true }
tamarin-term = { workspace = true }
tamarin-parser = { workspace = true }
rayon = { workspace = true }
rustc-hash = { workspace = true }
hashbrown = "0.17"
indexmap = { workspace = true }
fancy-regex = "0.18"
# `Theory.Constraint.System.JSON` (lib/theory's aeson dependency upstream).
serde_json = "1"
# Optional: the RL server's system codec (`system_codec`, feature `serde`):
# serde derives, encoded as postcard, then gzip, then base64url.
serde = { version = "1", features = ["derive", "rc"], optional = true }
postcard = { version = "1", default-features = false, features = ["alloc"], optional = true }
flate2 = { version = "1", optional = true }
base64 = { workspace = true, optional = true }

[features]
serde = [
    "dep:serde",
    "dep:postcard",
    "dep:flate2",
    "dep:base64",
    "tamarin-utils/serde",
    "tamarin-term/serde",
    "tamarin-parser/serde",
]

[dev-dependencies]
walkdir = "2"
# The examples load theories the way `tamarin-rs --prove` does, SAPIC and
# accountability translation included (examples/common). A dev-dependency
# cycle: examples link the same tamarin-theory instance these depend on.
tamarin-sapic = { workspace = true }
tamarin-accountability = { workspace = true }
# Same allocator as the prover binary; see crates/tamarin-prover/Cargo.toml.
mimalloc = { package = "rustfs-mimalloc", version = "=0.5.6" }

[lints]
workspace = true
