[package]
name = "tamarin-theory"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Theory representation for the Tamarin prover (Rust port)."

[dependencies]
tamarin-utils = { workspace = true }
tamarin-term = { workspace = true }
tamarin-parser = { workspace = true }
rayon = { workspace = true }
fancy-regex = "0.19"
# `Theory.Constraint.System.JSON` (lib/theory's aeson dependency upstream).
serde_json = "1"
# Optional: the RL server's system codec (`system_codec`, feature `serde`):
# serde derives, encoded as postcard, then gzip, then base64url.
serde = { version = "1", features = ["derive", "rc"], optional = true }
postcard = { version = "1", default-features = false, features = ["alloc"], optional = true }
flate2 = { version = "1", optional = true }
base64 = { version = "0.22", optional = true }

[features]
serde = [
    "dep:serde",
    "dep:postcard",
    "dep:flate2",
    "dep:base64",
    "tamarin-utils/serde",
    "tamarin-term/serde",
]

[dev-dependencies]
tamarin-test-support = { workspace = true }
# Dev-only cycle back onto the crates that consume this one: the stage-3
# probes run the driver's translation pipeline (`apply_sapic`, then
# `tamarin_accountability::translate`) over the examples tree.
tamarin-sapic = { workspace = true }
tamarin-accountability = { workspace = true }
walkdir = "2"
# Same allocator as the prover binary; see crates/tamarin-prover/Cargo.toml.
mimalloc = { package = "rustfs-mimalloc", version = "=0.5.6" }
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "simp_minimize"
harness = false

[lints]
workspace = true
