[package]
name = "tamarin-prover"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "The Tamarin prover for security protocol verification (Rust port)."

[lib]
name = "tamarin_prover"
path = "src/lib.rs"

[[bin]]
name = "tamarin-rs"
path = "src/main.rs"

[dependencies]
tamarin-utils = { workspace = true }
tamarin-term = { workspace = true }
tamarin-parser = { workspace = true }
tamarin-theory = { workspace = true }
tamarin-sapic = { workspace = true }
tamarin-server = { workspace = true }
tamarin-accountability = { workspace = true }
# tamarin-export is a placeholder crate not yet wired into the driver; its dep
# will be added here when that port lands.
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
# rustfs-mimalloc 0.5.6 ships the unmodified mimalloc v3.5.3 sources. The
# `mimalloc` crate (0.1.52) still ships v3.3.2, which can never create its
# 16 GiB arena (mimalloc issue #1309), so a process aborted on a small
# allocation at ~160 GiB RSS. Go back to `mimalloc` once it ships >= v3.4.
mimalloc = { package = "rustfs-mimalloc", version = "=0.5.6" }
rayon = { workspace = true }
clap = { workspace = true }

[features]
# `interactive` also serves the JSON API for the TamRL client (`/api/v1`).
rl = ["tamarin-server/rl"]

[lints]
workspace = true
