[package]
name = "tamarin-term"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Term language for the Tamarin prover (Rust port)."

[dependencies]
tamarin-utils = { workspace = true }
# Optional: derives for the RL server's system codec (feature `serde`).
serde = { version = "1", features = ["derive", "rc"], optional = true }

[features]
serde = ["dep:serde"]

[dev-dependencies]
tamarin-test-support = { workspace = true }

[build-dependencies]
tamarin-build = { workspace = true }

[lints]
workspace = true
