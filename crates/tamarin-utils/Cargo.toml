[package]
name = "tamarin-utils"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Utility library for the Tamarin prover (Rust port)."

[dependencies]
sha2 = { workspace = true }
base64 = { workspace = true }
rustc-hash = { workspace = true }
# Optional: derives for the RL server's system codec (feature `serde`).
serde = { version = "1", features = ["derive"], optional = true }

[features]
serde = ["dep:serde"]

[dev-dependencies]
proptest = "1"

[lints]
workspace = true
